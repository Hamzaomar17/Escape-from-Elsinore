<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamlet: Escape from Elsinore</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#15171c;--stone:#232730;--line:#3a3f4b;--ink:#ece2c8;--dim:#a39c88;--blood:#a63a46;--gold:#d0aa55;--ok:#6fae7e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.5 "Cormorant Garamond",Georgia,serif}
#app{max-width:900px;margin:0 auto;padding:10px 14px 40px}
h1,h2,h3{font-weight:700;margin:0 0 .4em;line-height:1.15}h1{font-size:2.5rem;color:var(--gold)}h2{font-size:1.4rem}h3{font-size:1.1rem;color:var(--gold)}
button{font:inherit;color:var(--ink);background:var(--stone);border:1px solid var(--line);border-radius:3px;padding:7px 14px;cursor:pointer;margin:3px 6px 3px 0}
button:hover:not(:disabled){border-color:var(--gold)}button:focus-visible,input:focus-visible,.obj:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}button.main{background:var(--blood);border-color:var(--blood);font-weight:700}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:7px 10px;width:12em;max-width:100%;text-transform:uppercase}
.bar{display:flex;flex-wrap:wrap;gap:4px 20px;justify-content:space-between;border-bottom:2px solid var(--gold);padding:4px 0 8px;margin-bottom:10px}
.bar b{color:var(--gold)}.clock{font-variant-numeric:tabular-nums}.low{color:var(--blood)}
svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:4px;background:var(--stone)}
.obj{cursor:pointer}.obj:hover{filter:brightness(1.3) drop-shadow(0 0 6px var(--gold))}
.lbl{fill:var(--ink);font:15px "Cormorant Garamond",Georgia,serif;text-anchor:middle}.ic{font-size:30px;text-anchor:middle}
.box{background:var(--stone);border:1px solid var(--line);border-radius:4px;padding:12px 16px;margin-top:12px}
.note{border-left:3px solid var(--gold);padding:4px 12px;margin:8px 0;font-style:italic;background:var(--bg);white-space:pre-line}
.msg{min-height:1.5em}.bad{color:var(--blood)}.good{color:var(--ok)}.dim{color:var(--dim)}
.slots{display:flex;flex-wrap:wrap;gap:6px}.slot{border:1px solid var(--line);background:var(--bg);padding:3px 10px;border-radius:3px;font-size:.95rem}
.chain{min-height:2em;color:var(--gold)}.center{text-align:center;padding:26px 0}.big{font-size:3rem;color:var(--gold)}
details{margin-top:12px;color:var(--dim);font-size:.9rem}ul{padding-left:20px}
@media(max-width:600px){h1{font-size:2rem}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl 1.3s ease-in-out infinite alternate}
.gh{animation:gh 4s ease-in-out infinite alternate}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(.9,1.1)}}
@keyframes gh{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@media(prefers-reduced-motion:reduce){.fl,.gh{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== GLOBAL VARIABLES (like GDevelop game variables) ===== */
const newVars=()=>({Score:0,TimeLeft:1800,EvidenceCount:0,HasSilverKey:0,LevelUnlocked:1,Solved:0,Practice:0});
/* ===== SCENES: objects + events (trigger, object, conditions, actions) ===== */
const say=(id,t)=>['click',id,[],[['say',t]]];
const doorEvents=(done)=>[
 ['click','door',[['Solved','=',0]],[['puzzle']]],
 ['click','door',[['Solved','=',1]],[['next']]],
 ['solved','',[],[['unlock','door'],['say','Click! The way forward is open.'],...done]]];
const SCENES=[
{name:'Level 1: The Ghost’s Warning',min:5,pts:100,bg:['#1c2540','#2a2f38'],deco:[['🌙',90,70,52],['🏰',420,180,60]],
 objs:[{id:'letter',x:110,y:235,w:80,h:55,ic:'📜',l:'Ghost’s letter',c:'#5a4a30'},{id:'wall',x:300,y:110,w:150,h:90,ic:'🗿',l:'Inscription',c:'#3b414d'},{id:'door',x:630,y:140,w:110,h:150,door:1,l:'Locked door',c:'#4a3626'}],
 puz:[{type:'order',q:'Select the words that reveal Hamlet’s mission, in order.',items:['Remember','Revenge','Father','Truth'],ans:['Remember','Father','Truth','Revenge'],hint:'Start with what the Ghost asks first: remember. Revenge comes last.'}],
 ev:[['enter','',[],[['say','A cold battlement. Mist coils around your boots. Search the room.']]],
  ['click','letter',[],[['item','Ghost’s letter'],['say','Four words are scratched on the page: Remember, Revenge, Father, Truth.']]],
  say('wall','“The dead ask for what the living must remember.”'),
  ...doorEvents([['item','Silver key'],['set','HasSilverKey',1]])],
 lit:'Act 1, Scene 5: the Ghost reveals the murder and asks Hamlet to remember him.'},
{name:'Level 2: The King’s Secret',min:6,pts:150,bg:['#3a2a22','#4b3a2a'],deco:[['🕯️',110,215,40],['🖼️',420,90,56]],
 objs:[{id:'desk',x:200,y:230,w:320,h:70,l:'',c:'#5c4128'},{id:'news',x:225,y:200,w:60,h:45,ic:'📰',l:'Announcement',c:'#6a5a3e'},{id:'mail',x:325,y:200,w:60,h:45,ic:'✉️',l:'Letter',c:'#6a5a3e'},{id:'note',x:425,y:200,w:60,h:45,ic:'🗒️',l:'Secret note',c:'#6a5a3e'},{id:'door',x:630,y:140,w:110,h:150,door:1,l:'Locked door',c:'#4a3626'}],
 puz:[{type:'text',q:'Decode the note. Shift each letter three places backward.',ans:'CLAUDIUS',hint:'F becomes C, O becomes L, D becomes A.'},
  {type:'choice',q:'Which character is Hamlet’s uncle and the new King of Denmark?',opts:['Polonius','Claudius','Laertes'],ans:1,hint:'You just decoded his name.'}],
 ev:[['enter','',[],[['say','A study lit by one candle. Three documents lie on the desk.']]],
  say('news','The King proclaims a season of feasting and calls for loyalty.'),say('mail','A courtier writes: “The prince watches you closely.”'),
  say('note','The note reads FODXGLXV.\nClue: “Every letter has moved three places forward.”'),
  ...doorEvents([['evidence','The Secret Message']])],
 lit:'Claudius’s suspicious behavior and Hamlet’s growing distrust.'},
{name:'Level 3: The Mousetrap',min:7,pts:200,bg:['#4a1f2a','#3a2a22'],deco:[['🎭',390,70,56]],
 objs:[{id:'bill',x:90,y:150,w:80,h:60,ic:'🎟️',l:'Playbill',c:'#5a4a30'},{id:'book',x:200,y:235,w:80,h:55,ic:'📓',l:'Hamlet’s notes',c:'#3b414d'},{id:'stage',x:330,y:190,w:230,h:100,ic:'🎭',l:'Stage',c:'#5a2a30'},{id:'door',x:630,y:140,w:110,h:150,door:1,l:'Locked door',c:'#4a3626'}],
 puz:[{type:'choice',q:'Which method does Hamlet use to test the King’s conscience?',opts:['Challenge Claudius to a duel immediately.','Perform a play resembling the murder.','Ask Gertrude to reveal the truth.'],ans:1,hint:'The play’s the thing.'},
  {type:'choice',q:'How does Claudius react when the performance reaches the murder scene?',opts:['He applauds the actors.','He becomes disturbed and stops the performance.','He falls asleep.'],ans:1,hint:'A guilty conscience cannot watch its own crime.'}],
 ev:[['enter','',[],[['say','The court theatre. Actors wait in costume while the royal seats fill.']]],
  say('bill','“The Murder of Gonzago.” A traveling troupe performs tonight.'),say('book','“I’ll have these players play something like the murder of my father before mine uncle.”'),say('stage','The actors are ready for your scene.'),
  ...doorEvents([['evidence','The King’s Reaction']])],
 lit:'Act 3, Scene 2: Hamlet stages the play to observe Claudius.'},
{name:'Level 4: The Chamber of Doubt',min:6,pts:200,bg:['#232a35','#30343c'],deco:[],
 objs:[{id:'rev',x:90,y:130,w:130,h:160,door:1,l:'Revenge',c:'#5a2a30',lock:1},{id:'tru',x:335,y:130,w:130,h:160,door:1,l:'Truth',c:'#2f4a46',lock:1},{id:'door',x:580,y:130,w:130,h:160,door:1,l:'Doubt',c:'#3b414d'}],
 puz:[{type:'text',q:'Complete the quotation: “To be, or not to be: that is the ___.”',ans:'QUESTION',hint:'It is the one word that sums up Hamlet’s whole dilemma.'},
  {type:'choice',q:'Why does Hamlet hesitate before taking action?',opts:['He is unaware of the Ghost.','He struggles with uncertainty, morality, and the consequences of action.','He wants to become a soldier.'],ans:1,hint:'Think about the soliloquy.'}],
 ev:[['enter','',[],[['say','Three doors: Revenge, Truth, Doubt. Only one asks questions.']]],
  say('rev','Warm to the touch. Behind it, a blade. It will not open.'),say('tru','Plain and cold. It stays shut until you understand the price.'),
  ...doorEvents([['evidence','The Prince’s Decision']])],
 lit:'Act 3, Scene 1: Hamlet’s soliloquy explores life, death, and indecision.'},
{name:'Level 5: The Final Accusation',min:6,pts:250,bg:['#3a1f28','#2b2d35'],deco:[['🕯️',60,200,40],['🕯️',380,200,40]],
 objs:[{id:'throne',x:110,y:150,w:100,h:140,ic:'👑',l:'Throne',c:'#6a2a34'},{id:'cup',x:260,y:245,w:60,h:45,ic:'🏆',l:'Goblet',c:'#5a4a30'},{id:'door',x:500,y:110,w:240,h:180,door:1,l:'Castle gates',c:'#3b3226'}],
 puz:[{type:'order',q:'Arrange your three evidence cards in the order you uncovered them.',items:['The Prince’s Decision','The Secret Message','The King’s Reaction'],ans:['The Secret Message','The King’s Reaction','The Prince’s Decision'],hint:'Follow your path: Level 2, then 3, then 4.'},
  {type:'choice',q:'Who murdered King Hamlet?',opts:['Polonius','Laertes','Claudius'],ans:2,hint:'The Ghost named him.'},
  {type:'choice',q:'Why did Hamlet stage The Mousetrap?',opts:['To entertain the court.','To test Claudius’s guilt by observing his reaction.','To distract the guards.'],ans:1,hint:'He needed proof beyond a ghost’s word.'},
  {type:'choice',q:'Final choice: what do you do?',opts:['Accuse Claudius without evidence.','Remain silent.','Present the evidence and expose the truth.'],ans:2,hint:'You have worked too hard for silence.'}],
 ev:[['enter','',[],[['say','The throne room. Claudius rises. The gates behind him are barred.']]],
  say('throne','Claudius stands before it, watching your every move.'),say('cup','A goblet left by the throne. Best not to touch it.'),
  ...doorEvents([])],
 lit:'The mystery is solved by the Ghost’s revelation and Hamlet’s investigation, though the original tragedy ends in widespread death.'}
];
/* ===== ENGINE ===== */
const $=id=>document.getElementById(id);
const FB=['Not quite. Examine the clues again.','Incorrect. You lose 10 points on this puzzle.','The court is watching. Try again.'];
let V,S,timer;
const fresh=()=>{V=newVars();S={scr:'title',sc:0,pi:0,tries:0,inv:[],ev:[],sel:[],unl:{},msg:'',cls:'',open:0,hint:'',fb:0}};
fresh();
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const test=c=>{const[a,o,b]=c;return o==='='?V[a]===b:V[a]>=b};
const ACT={
 say:t=>{S.msg=t;S.cls=''},
 puzzle:()=>{S.open=1;S.msg='';S.hint=''},
 set:(k,v)=>V[k]=v,
 add:(k,n)=>V[k]+=n,
 item:n=>{if(!S.inv.includes(n))S.inv.push(n)},
 evidence:n=>{if(!S.ev.includes(n)){S.ev.push(n);V.EvidenceCount++;ACT.item('Evidence: '+n)}},
 unlock:id=>S.unl[id]=1,
 next:()=>{
  if(S.sc<SCENES.length-1){S.sc++;V.LevelUnlocked++;V.Solved=0;S.pi=0;S.unl={};S.open=0;S.hint='';fire('enter','')}
  else{S.scr='end';clearInterval(timer)}}
};
function fire(tr,id){SCENES[S.sc].ev.forEach(e=>{if(e[0]===tr&&e[1]===id&&e[2].every(test))e[3].forEach(a=>ACT[a[0]](...a.slice(1)))})}
function click(id){if(S.scr!=='game'||S.open&&!V.Solved)return;fire('click',id);render()}
function start(){fresh();S.scr='game';clearInterval(timer);timer=setInterval(tick,1000);fire('enter','');render()}
function tick(){
 if(S.scr!=='game'||V.Practice)return;
 if(--V.TimeLeft<=0){V.TimeLeft=0;S.scr='over';clearInterval(timer);render();return}
 const c=$('clock');if(c){c.textContent=fmt(V.TimeLeft);c.className='clock'+(V.TimeLeft<120?' low':'')}
}
/* puzzles */
const P=()=>SCENES[S.sc].puz[S.pi];
function good(){
 const sc=SCENES[S.sc];V.Score+=Math.max(0,sc.pts/sc.puz.length-10*S.tries);
 S.tries=0;S.sel=[];S.hint='';S.cls='good';
 if(S.pi<sc.puz.length-1){S.pi++;S.msg='Correct. The next puzzle awaits.'}
 else{V.Solved=1;S.open=0;fire('solved','')}
 render();
}
function bad(){S.tries++;S.sel=[];S.msg=FB[S.fb++%3];S.cls='bad';render()}
const pick=i=>i===P().ans?good():bad();
const sub=()=>$('inp').value.trim().toUpperCase()===P().ans?good():bad();
function ord(i){
 const p=P();S.sel.push(p.items[i]);
 if(S.sel.length===p.items.length)return S.sel.join('|')===p.ans.join('|')?good():bad();
 S.msg='';render();
}
function hint(){V.Score=Math.max(0,V.Score-20);S.hint=P().hint;render()}
const practice=()=>{V.Practice=1;S.scr='game';render()};
/* ===== RENDER ===== */
/* ===== ROOM ARTWORK (SVG) ===== */
const DEFS=`<defs>
<pattern id="brk" width="64" height="32" patternUnits="userSpaceOnUse"><path d="M0 0H64M0 16H64M32 0V16M0 16V32" stroke="#000" stroke-opacity=".35" fill="none"/></pattern>
<pattern id="flr" width="110" height="46" patternUnits="userSpaceOnUse"><path d="M0 0H110M55 0V23M0 23H110M0 23V46" stroke="#000" stroke-opacity=".3" fill="none"/></pattern>
<pattern id="wd" width="16" height="20" patternUnits="userSpaceOnUse"><path d="M0 0V20" stroke="#000" stroke-opacity=".35"/><path d="M8 0V20" stroke="#fff" stroke-opacity=".06"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#ffb347" stop-opacity=".6"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<radialGradient id="glowb"><stop offset="0" stop-color="#6fb8ff" stop-opacity=".45"/><stop offset="1" stop-color="#6fb8ff" stop-opacity="0"/></radialGradient>
<radialGradient id="mg"><stop offset="0" stop-color="#dfe6ff" stop-opacity=".5"/><stop offset="1" stop-color="#dfe6ff" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></radialGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1030"/><stop offset="1" stop-color="#43336a"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c8" stop-opacity=".4"/><stop offset="1" stop-color="#fff3c8" stop-opacity=".05"/></linearGradient>
<linearGradient id="cur" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a0f1b"/><stop offset=".2" stop-color="#a8263a"/><stop offset=".4" stop-color="#5a0f1b"/><stop offset=".6" stop-color="#a8263a"/><stop offset=".8" stop-color="#5a0f1b"/><stop offset="1" stop-color="#8a1d2f"/></linearGradient></defs>`;
const BK=['#7a1f2b','#2f5a4a','#c2a14a','#3a4a7a','#6a3a2a'];
const books=(x,y,w,n)=>{let s=`<rect x="${x}" y="${y}" width="${w}" height="${n*46}" fill="#2a190f"/>`;for(let r=0;r<n;r++){let bx=x+4;for(let i=0;bx<x+w-14;i++){const bw=9+(i*7+r)%7,bh=26+(i*5+r*3)%12;s+=`<rect x="${bx}" y="${y+r*46+42-bh}" width="${bw}" height="${bh}" fill="${BK[(i+r*2)%5]}"/>`;bx+=bw+1}s+=`<rect x="${x}" y="${y+r*46+42}" width="${w}" height="4" fill="#5a3a22"/>`}return s};
const torch=(x,y,c='#ffb347',g='glow')=>`<circle cx="${x}" cy="${y}" r="80" fill="url(#${g})"/><rect x="${x-4}" y="${y+4}" width="8" height="30" fill="#2a2018"/><path d="M${x-10} ${y+6}h20l-4-10h-12z" fill="#3a2a1c"/><path class="fl" d="M${x} ${y-26}C${x+13} ${y-10} ${x+10} ${y} ${x} ${y+2}C${x-10} ${y} ${x-13} ${y-10} ${x} ${y-26}Z" fill="${c}"/><path class="fl" d="M${x} ${y-12}C${x+5} ${y-6} ${x+4} ${y-2} ${x} ${y}C${x-4} ${y-2} ${x-5} ${y-6} ${x} ${y-12}Z" fill="#fff4c0"/>`;
const flo=(c,p)=>`<rect y="290" width="800" height="130" fill="${c}"/><rect y="290" width="800" height="130" fill="url(#${p})"/><rect y="290" width="800" height="6" fill="#000" opacity=".4"/>`;
const pil=x=>`<rect x="${x}" width="50" height="290" fill="#3c4352"/><rect x="${x}" width="50" height="290" fill="url(#shine)"/><rect x="${x-6}" width="62" height="18" fill="#4a5262"/><rect x="${x-6}" y="272" width="62" height="18" fill="#4a5262"/>`;
const ban=x=>`<path d="M${x} 0H${x+60}V150L${x+30} 122L${x} 150Z" fill="#8a1d2f" stroke="#d0aa55" stroke-width="3"/><text class="ic" x="${x+30}" y="78">👑</text>`;
const stars=()=>{let s='';for(let i=0;i<45;i++)s+=`<circle cx="${(i*97)%800}" cy="${(i*53)%230}" r="${i%4?1:1.8}" fill="#fff" opacity="${.4+(i%5)/10}"/>`;return s};
const merl=()=>{let s='<rect y="262" width="800" height="30" fill="#2c303c"/>';for(let i=0;i<8;i++)s+=`<rect x="${i*105+12}" y="238" width="64" height="26" fill="#2c303c"/>`;return s};
const aud=()=>{let s='';for(let i=0;i<12;i++){const x=30+i*68;s+=`<ellipse cx="${x}" cy="428" rx="28" ry="24" fill="#0e0710"/><circle cx="${x}" cy="402" r="13" fill="#0e0710"/>`}return s};
const ART=[
()=>`<rect width="800" height="290" fill="url(#sky)"/>${stars()}<circle cx="120" cy="80" r="95" fill="url(#mg)"/><circle cx="120" cy="80" r="38" fill="#f3ecd0"/><path d="M300 262V150L318 118L336 150V262ZM390 262V100L410 62L430 100V262ZM470 262V160H520V262Z" fill="#141a33"/><rect x="405" y="130" width="10" height="16" fill="#ffcf70"/><rect x="313" y="175" width="10" height="16" fill="#ffcf70"/>${merl()}${flo('#3a3f4a','flr')}<g class="gh"><path d="M560 70c-26 0-34 28-30 60l-14 40c14-6 24 4 36-4 12 8 24-2 36 4l-14-40c4-32-4-60-30-60z" fill="#d6e6ff" opacity=".38"/><circle cx="550" cy="100" r="4" fill="#0b1030"/><circle cx="570" cy="100" r="4" fill="#0b1030"/></g><ellipse cx="400" cy="288" rx="430" ry="24" fill="#cfd8ff" opacity=".14"/>`,
()=>`<rect width="800" height="290" fill="#4a2f22"/><rect width="800" height="290" fill="url(#brk)"/>${books(20,50,150,5)}${books(530,50,90,5)}<path d="M315 175V85a45 45 0 0 1 90 0V175Z" fill="#1b2a4d" stroke="#2a190f" stroke-width="8"/><path d="M360 40V175M315 110H405" stroke="#2a190f" stroke-width="4"/><circle cx="385" cy="75" r="9" fill="#f3ecd0"/>${torch(255,110)}${torch(480,110)}${flo('#5a3a22','wd')}<ellipse cx="360" cy="352" rx="250" ry="42" fill="#7a1f2b" stroke="#d0aa55" stroke-width="3"/><ellipse cx="360" cy="352" rx="200" ry="30" fill="none" stroke="#d0aa55" stroke-opacity=".5"/>`,
()=>`<rect width="800" height="290" fill="#2a1630"/><path d="M70 290V130a265 110 0 0 1 530 0V290Z" fill="#12091a" stroke="#d0aa55" stroke-width="5"/>${flo('#5a3a22','wd')}<polygon points="445,0 375,290 515,290" fill="url(#beam)"/><rect x="40" y="272" width="560" height="26" fill="#7a4e2a"/><rect x="40" y="272" width="560" height="26" fill="url(#wd)"/><path d="M0 0H105C95 90 118 200 88 290H0Z" fill="url(#cur)"/><path d="M600 0H545C558 90 538 200 568 290H600Z" fill="url(#cur)"/><path d="M0 0H600V32Q550 58 500 32Q450 58 400 32Q350 58 300 32Q250 58 200 32Q150 58 100 32Q50 58 0 32Z" fill="#8a1d2f" stroke="#d0aa55" stroke-width="3"/>${aud()}${torch(665,110)}`,
()=>`<rect width="800" height="290" fill="#2a3140"/><rect width="800" height="290" fill="url(#brk)"/>${flo('#232a36','flr')}<ellipse cx="400" cy="352" rx="300" ry="46" fill="none" stroke="#d0aa55" stroke-opacity=".55" stroke-width="3" stroke-dasharray="7 11"/><ellipse cx="400" cy="352" rx="210" ry="30" fill="none" stroke="#7ec8ff" stroke-opacity=".5" stroke-width="2"/>${pil(252)}${pil(497)}${torch(277,120,'#7ec8ff','glowb')}${torch(522,120,'#7ec8ff','glowb')}`,
()=>`<rect width="800" height="290" fill="#3a1a24"/><rect width="800" height="290" fill="url(#brk)"/><polygon points="150,0 230,0 310,290 120,290" fill="#fff" opacity=".05"/>${flo('#2b2d35','flr')}<polygon points="250,420 550,420 480,290 320,290" fill="#8a1d2f"/><path d="M250 420L320 290M550 420L480 290" stroke="#d0aa55" stroke-width="4"/>${ban(250)}${ban(330)}${pil(18)}${pil(440)}${torch(80,140)}${torch(465,140)}`
];
const OA={
 desk:o=>`<rect x="${o.x}" y="${o.y}" width="${o.w}" height="14" rx="3" fill="#7a5230"/><rect x="${o.x}" y="${o.y}" width="${o.w}" height="14" fill="url(#shine)"/><rect x="${o.x+14}" y="${o.y+14}" width="${o.w-28}" height="${o.h-14}" fill="#4a2f1a"/><rect x="${o.x+14}" y="${o.y+14}" width="${o.w-28}" height="${o.h-14}" fill="url(#wd)"/>`,
 throne:o=>`<path d="M${o.x+10} ${o.y+o.h}V${o.y+30}a${o.w/2-10} 30 0 0 1 ${o.w-20} 0V${o.y+o.h}Z" fill="#7a1f2b" stroke="#d0aa55" stroke-width="4"/><rect x="${o.x}" y="${o.y+o.h-45}" width="${o.w}" height="45" rx="6" fill="#5a1220" stroke="#d0aa55" stroke-width="3"/>`,
 stage:o=>`<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="6" fill="#000" fill-opacity=".12" stroke="#d0aa55" stroke-opacity=".55" stroke-width="2" stroke-dasharray="6 6"/>`
};
const defArt=o=>`<ellipse cx="${o.x+o.w/2}" cy="${o.y+o.h}" rx="${o.w/2}" ry="6" fill="#000" opacity=".4"/><rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="7" fill="${o.c}" stroke="#d0aa55" stroke-opacity=".5" stroke-width="2"/><rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="7" fill="url(#shine)"/>`;
function doorArt(o,open){
 const{x,y,w,h}=o,r=w/2,a=`M${x} ${y+h}V${y+r}a${r} ${r} 0 0 1 ${w} 0V${y+h}Z`;
 return `<path d="${a}" fill="${open?'#0d0a08':'#6b4a2c'}"/>`+(open?`<path d="${a}" fill="url(#glow)"/>`:`<path d="${a}" fill="url(#wd)"/><path d="${a}" fill="${o.c}" opacity=".45"/><rect x="${x}" y="${y+r+18}" width="${w}" height="12" fill="#1d1d22"/><rect x="${x}" y="${y+h-36}" width="${w}" height="12" fill="#1d1d22"/><circle cx="${x+w-22}" cy="${y+r+60}" r="11" fill="#d0aa55"/><path d="M${x+w-22} ${y+r+56}v10" stroke="#222" stroke-width="3"/>`)+`<path d="${a}" fill="none" stroke="#7b808c" stroke-width="7"/>`;
}
function room(sc){
 let s=`<svg viewBox="0 0 800 420" role="img" aria-label="${sc.name}">${DEFS}${ART[S.sc]()}<rect width="800" height="420" fill="url(#vig)" pointer-events="none"/>`;
 sc.objs.forEach(o=>{
  const open=S.unl[o.id],cx=o.x+o.w/2;
  const art=o.door?doorArt(o,open):(OA[o.id]||defArt)(o);
  const ic=!o.door&&o.ic?`<text class="ic" x="${cx}" y="${o.y+o.h/2+10}">${o.ic}</text>`:'';
  const lb=o.l?`<rect x="${cx-o.l.length*3.6-8}" y="${o.y+o.h+5}" width="${o.l.length*7.2+16}" height="20" rx="3" fill="#000" opacity=".55"/><text class="lbl" x="${cx}" y="${o.y+o.h+20}">${o.l}${open?' (open)':''}</text>`:'';
  s+=o.l||o.ic?`<g class="obj" tabindex="0" role="button" aria-label="${o.l}" onclick="click('${o.id}')" onkeydown="if(event.key==='Enter')click('${o.id}')">${art}${ic}${lb}</g>`:art;
 });
 return s+'</svg>';
}
function roomOld(sc){
 let s=`<svg viewBox="0 0 800 420" role="img" aria-label="${sc.name}"><rect width="800" height="290" fill="${sc.bg[0]}"/><rect y="290" width="800" height="130" fill="${sc.bg[1]}"/>`;
 sc.deco.forEach(d=>s+=`<text x="${d[1]}" y="${d[2]}" font-size="${d[3]}" text-anchor="middle">${d[0]}</text>`);
 sc.objs.forEach(o=>{
  const open=S.unl[o.id],cx=o.x+o.w/2,shape=o.door
   ?`<path d="M${o.x} ${o.y+o.h}V${o.y+o.w/2}a${o.w/2} ${o.w/2} 0 0 1 ${o.w} 0V${o.y+o.h}Z" fill="${open?'#1a1410':o.c}" stroke="#000" stroke-opacity=".4" stroke-width="2"/>`
   :`<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="6" fill="${o.c}" stroke="#000" stroke-opacity=".4" stroke-width="2"/>`;
  const icon=o.door?(open?'🚪':'🔒'):(o.ic||'');
  if(!o.l&&!o.ic)return s+=shape;
  s+=`<g class="obj" tabindex="0" role="button" aria-label="${o.l}" onclick="click('${o.id}')" onkeydown="if(event.key==='Enter')click('${o.id}')">${shape}<text class="ic" x="${cx}" y="${o.y+o.h/2+(o.door?24:10)}">${icon}</text><text class="lbl" x="${cx}" y="${o.y+o.h+20}">${o.l}${open?' (open)':''}</text></g>`;
 });
 return s+'</svg>';
}
function render(){
 const a=$('app');
 if(S.scr==='title')a.innerHTML=`<div class="center"><h1>Hamlet: Escape from Elsinore</h1><p>An escape room inspired by Shakespeare’s <i>Hamlet</i>.</p>
 <button class="main" onclick="start()">Play</button><button onclick="S.scr='info';render()">Instructions</button><button onclick="S.scr='cred';render()">Credits</button></div>`;
 else if(S.scr==='info')a.innerHTML=`<div class="box"><h2>Instructions</h2><ul><li>Click objects in each room to find clues. Click the door to start its puzzle.</li>
 <li>Solve the puzzle to unlock the door, then click it again to enter the next room.</li><li>You have 30 minutes, five levels, and three pieces of evidence to collect.</li>
 <li>A wrong answer costs 10 points and a hint costs 20. You can always try again.</li><li>Finishing early earns up to 100 bonus points. Maximum score: 1,000.</li>
 <li>Ranks: 900+ Master Detective, 700+ Royal Investigator, 500+ Apprentice.</li></ul><button onclick="S.scr='title';render()">Back</button></div>`;
 else if(S.scr==='cred')a.innerHTML=`<div class="box"><h2>Credits</h2><p>Inspired by William Shakespeare’s <i>Hamlet</i>. Game design from the class project brief; structured like a GDevelop project (scenes, objects, variables, events).</p><button onclick="S.scr='title';render()">Back</button></div>`;
 else if(S.scr==='over')a.innerHTML=`<div class="center"><h1>The guards have found you</h1><p>Time ran out in ${SCENES[S.sc].name}. Score so far: ${V.Score}.</p><button class="main" onclick="start()">Restart</button><button onclick="practice()">Continue in practice mode</button></div>`;
 else if(S.scr==='end')endScreen(a);
 else game(a);
}
function game(a){
 const sc=SCENES[S.sc],p=P();
 let h=`<div class="bar"><span><b>${sc.name}</b></span><span>${V.Practice?'Practice mode':`Time <b id="clock" class="clock${V.TimeLeft<120?' low':''}">${fmt(V.TimeLeft)}</b>`}</span><span>Score <b>${V.Score}</b></span><span>Evidence <b>${V.EvidenceCount}/3</b></span></div>${room(sc)}
 <div class="note msg ${S.cls}">${S.msg||'Click an object to examine it.'}</div>`;
 if(S.open&&!V.Solved){
  h+=`<div class="box"><h3>Puzzle ${S.pi+1} of ${sc.puz.length}</h3><p>${p.q}</p>`;
  if(p.type==='choice')p.opts.forEach((o,i)=>h+=`<div><button onclick="pick(${i})">${o}</button></div>`);
  if(p.type==='text')h+=`<input id="inp" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key==='Enter')sub()"><button class="main" onclick="sub()">Submit</button>`;
  if(p.type==='order'){h+=`<div class="chain">${S.sel.join(' → ')||'Nothing chosen yet.'}</div>`;
   p.items.forEach((w,i)=>h+=`<button ${S.sel.includes(w)?'disabled':''} onclick="ord(${i})">${w}</button>`);h+=`<button onclick="S.sel=[];render()">Reset</button>`}
  h+=`<div><button onclick="hint()">Hint (−20)</button></div>${S.hint?`<div class="note">${S.hint}</div>`:''}</div>`;
 }
 if(V.Solved)h+=`<p class="dim">${sc.lit}</p>`;
 h+=`<div class="box"><h3>Inventory</h3><div class="slots">${S.inv.map(i=>`<span class="slot">${i}</span>`).join('')||'<span class="dim">Empty</span>'}</div></div>
 <details><summary>Game variables</summary>${Object.entries(V).map(([k,v])=>`${k}: ${v}`).join(' | ')}</details>`;
 a.innerHTML=h;
 const i=$('inp');if(i)i.focus();
}
function endScreen(a){
 const bonus=V.Practice?0:Math.min(100,Math.floor(V.TimeLeft/10)),f=Math.min(1000,V.Score+bonus);
 const r=f>=900?'Master Detective':f>=700?'Royal Investigator':f>=500?'Apprentice':'Try Again';
 a.innerHTML=`<div class="center"><h1>The truth is revealed</h1><p>You uncovered the secret of Elsinore, gathered the evidence, and exposed Claudius.</p>
 <p class="dim">Final score</p><div class="big">${f} / 1,000</div><p>Base ${V.Score} + time bonus ${bonus}</p>
 <p>Evidence collected: ${V.EvidenceCount} / 3<br>Rank: <b style="color:var(--gold)">${r}</b></p>
 <div class="note" style="display:inline-block;text-align:left">“The play’s the thing wherein I’ll catch the conscience of the king.”<br>Hamlet, Act 2, Scene 2</div>
 <p><button class="main" onclick="start()">Play again</button><button onclick="fresh();render()">Main menu</button></p></div>`;
}
render();
</script>
</body>
</html>
